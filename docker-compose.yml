version: '3.8'
services:
  postgres:
    image: postgres:18
    container_name: shoutech_postgres
    environment:
      - POSTGRES_USER=shoutech
      - POSTGRES_PASSWORD=${SHOUTECH_POSTGRES_PASSWORD:?Set SHOUTECH_POSTGRES_PASSWORD}
      - POSTGRES_DB=shoutech
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoutech -d shoutech"]
      interval: 10s
      retries: 10
  mysql:
    image: mysql:8.4
    container_name: shoutech_mysql
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: shoutech
      MYSQL_USER: shoutech
      MYSQL_PASSWORD: ${SHOUTECH_MYSQL_PASSWORD:?Set SHOUTECH_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SHOUTECH_MYSQL_ROOT_PASSWORD:?Set SHOUTECH_MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u shoutech -p$${MYSQL_PASSWORD}"]
      interval: 10s
      retries: 10
